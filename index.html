<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業版遺產稅試算與預留稅源推演系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: #0b0f19;
        }
        .tab-btn.active {
            background-color: #1e293b;
            color: #38bdf8;
            font-weight: 700;
        }
    </style>
</head>
<body class="text-slate-200 flex flex-col justify-center items-center p-2 sm:p-4">

<!-- 主卡片：鎖定最大高度與寬度，杜絕畫面往下延伸 -->
<div class="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-xl shadow-2xl overflow-hidden flex flex-col">
    
    <!-- 頂部列 (Header) -->
    <div class="px-5 py-2.5 bg-slate-950 border-b border-slate-800 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            <h1 class="text-sm sm:text-base font-bold text-white tracking-wide">遺產稅精算與稅源缺口推演</h1>
            <span class="text-[11px] text-slate-400 hidden sm:inline">| 純本地即時計算・無資料外流風險</span>
        </div>
        <div class="flex bg-slate-800 rounded p-0.5 text-xs">
            <button id="btnBasic" onclick="switchMode('basic')" class="tab-btn active px-3 py-1 rounded transition">總額速算</button>
            <button id="btnDetail" onclick="switchMode('detail')" class="tab-btn px-3 py-1 rounded text-slate-400 transition">資產細項</button>
        </div>
    </div>

    <!-- 內容核心區：雙欄網格 -->
    <div class="grid grid-cols-1 md:grid-cols-12 text-xs">
        
        <!-- 左側輸入區 (7欄) -->
        <div class="md:col-span-7 p-4 space-y-3 border-b md:border-b-0 md:border-r border-slate-800">
            
            <!-- 模式一：總量速算 -->
            <div id="boxBasic" class="space-y-2.5">
                <div class="flex items-center justify-between">
                    <span class="text-slate-300 font-medium">預估遺產總額</span>
                    <div class="flex items-center gap-1">
                        <input type="number" id="baseTotal" value="8000" step="100" class="w-24 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-right text-white font-bold outline-none focus:border-blue-500">
                        <span class="text-slate-400 text-[11px]">萬元</span>
                    </div>
                </div>
                <div class="bg-slate-800/40 p-2 rounded border border-slate-700/60">
                    <div class="flex justify-between text-[11px] text-slate-400 mb-1">
                        <span>不流動資產比例 (不動產/未上市股)</span>
                        <span id="txtIlliquid" class="text-amber-400 font-bold">80%</span>
                    </div>
                    <input type="range" id="rngIlliquid" min="10" max="95" value="80" class="w-full h-1.5 bg-slate-700 rounded cursor-pointer accent-blue-500" oninput="document.getElementById('txtIlliquid').textContent=this.value+'%'">
                </div>
            </div>

            <!-- 模式二：細項精算 -->
            <div id="boxDetail" class="hidden grid grid-cols-2 gap-2 bg-slate-800/40 p-2 rounded border border-slate-700/60">
                <div>
                    <label class="block text-[10px] text-slate-400 mb-0.5">房地產現值 (萬元)</label>
                    <input type="number" id="dRealEstate" value="4500" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-white">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 mb-0.5">上市櫃股票 (萬元)</label>
                    <input type="number" id="dPublicStock" value="1500" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-white">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 mb-0.5">未上市股權 (萬元)</label>
                    <input type="number" id="dPrivateStock" value="1000" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-white">
                </div>
                <div>
                    <label class="block text-[10px] text-blue-400 mb-0.5 font-bold">活定存現金 (萬元)</label>
                    <input type="number" id="dCash" value="1000" class="w-full bg-slate-800 border border-blue-500/50 rounded px-2 py-1 text-blue-300 font-bold">
                </div>
            </div>

            <!-- 免稅額與親屬條件 -->
            <div class="space-y-1.5 pt-1">
                <div class="flex justify-between items-center text-[11px]">
                    <span class="font-bold text-slate-300">法定扣除額與親屬狀況</span>
                    <span class="text-slate-500">免稅額基準 1,333萬 + 喪葬 138萬</span>
                </div>
                <div class="grid grid-cols-2 gap-1.5">
                    <label class="flex items-center gap-1.5 bg-slate-800/60 px-2 py-1.5 rounded border border-slate-700 cursor-pointer">
                        <input type="checkbox" id="chkSpouse" checked class="w-3.5 h-3.5 accent-blue-500">
                        <span>配偶健在 (扣553萬)</span>
                    </label>
                    <div class="flex items-center justify-between bg-slate-800/60 px-2 py-1.5 rounded border border-slate-700">
                        <span class="text-slate-400">成年子女數：</span>
                        <input type="number" id="numChild" value="2" min="0" max="8" class="w-10 bg-slate-700 rounded text-center text-white font-bold">
                    </div>
                    <div class="flex items-center justify-between bg-slate-800/60 px-2 py-1.5 rounded border border-slate-700">
                        <span class="text-slate-400">父母健在數：</span>
                        <input type="number" id="numParents" value="0" min="0" max="2" class="w-10 bg-slate-700 rounded text-center text-white font-bold">
                    </div>
                    <div class="flex items-center justify-between bg-slate-800/60 px-2 py-1.5 rounded border border-slate-700">
                        <span class="text-slate-400">重度身障數：</span>
                        <input type="number" id="numDisability" value="0" min="0" max="4" class="w-10 bg-slate-700 rounded text-center text-white font-bold">
                    </div>
                </div>
            </div>

            <!-- 配偶請求權 -->
            <div class="bg-amber-950/20 border border-amber-800/40 p-2 rounded text-[11px] space-y-1">
                <label class="flex items-center gap-1.5 font-medium text-amber-200 cursor-pointer">
                    <input type="checkbox" id="chkClaim" class="w-3.5 h-3.5 accent-amber-500" onchange="toggleClaim()">
                    <span>啟用配偶剩餘財產請求權 (民法第1030-1條扣除)</span>
                </label>
                <div id="boxClaimInput" class="hidden pl-5 pt-0.5 flex items-center gap-1.5 text-amber-300">
                    <span>扣除額度：</span>
                    <input type="number" id="claimAmount" value="1500" class="w-20 bg-slate-800 border border-amber-700 rounded px-1.5 py-0.5 text-right font-bold text-white">
                    <span>萬元</span>
                </div>
            </div>

            <button onclick="calculateAll()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded text-xs transition">
                重新計算
            </button>
        </div>

        <!-- 右側診斷看板與固定圖表 (5欄) -->
        <div class="md:col-span-5 p-4 bg-slate-950/40 flex flex-col justify-between space-y-2.5">
            
            <!-- 數據總覽 -->
            <div class="grid grid-cols-2 gap-2 text-center">
                <div class="bg-slate-800/70 p-2 rounded border border-slate-700">
                    <span class="text-slate-400 text-[10px] block">預估應納遺產稅</span>
                    <span id="valTax" class="text-base font-black text-white">0 萬</span>
                    <span id="valRate" class="text-[9px] text-slate-400 block">級距: --</span>
                </div>
                <div class="bg-slate-800/70 p-2 rounded border border-slate-700">
                    <span class="text-slate-400 text-[10px] block">帳戶可用現金</span>
                    <span id="valCash" class="text-base font-bold text-blue-400">0 萬</span>
                    <span class="text-[9px] text-slate-400 block">未完稅前暫凍結</span>
                </div>
            </div>

            <!-- 現金缺口警告框 -->
            <div id="boxGap" class="p-2.5 rounded border text-xs">
                <div class="flex justify-between items-center">
                    <span class="font-bold" id="lblGapTitle">繳稅現金自籌缺口</span>
                    <span id="badgeGap" class="px-1.5 py-0.2 rounded text-[10px] font-bold">警示</span>
                </div>
                <div id="valGap" class="text-xl font-black mt-0.5">- 0 萬元</div>
                <p id="txtGapDesc" class="text-[10px] opacity-80 mt-0.5 leading-snug">
                    繼承人須在 2 個月內完稅，否則面臨滯納金或資產處分問題。
                </p>
            </div>

            <!-- 圖表展示區：使用固定內聯樣式鎖死高度，徹底杜絕無限延伸 -->
            <div class="bg-slate-800/40 p-2 rounded border border-slate-700/60 flex flex-col items-center">
                <span class="text-[10px] text-slate-400 mb-1">資產與缺口比例</span>
                <!-- 容器絕對定高 150px，overflow hidden -->
                <div style="position: relative; height: 140px; width: 100%; max-width: 260px; overflow: hidden;">
                    <canvas id="balanceChart"></canvas>
                </div>
            </div>

            <!-- 關鍵提示 -->
            <div class="text-[10px] text-slate-400 bg-slate-900 p-2 rounded border border-slate-800 flex items-start gap-1">
                <span class="text-amber-400 shrink-0">💡</span>
                <span>人壽保險身故保險金指定受益人，免經遺產凍結，可迅速支應稅源避免賤賣家產。</span>
            </div>

        </div>
    </div>
</div>

<script>
let currentMode = 'basic';
let chartInstance = null;

function switchMode(mode) {
    currentMode = mode;
    document.getElementById('btnBasic').className = mode === 'basic' ? 'tab-btn active px-3 py-1 rounded' : 'tab-btn px-3 py-1 rounded text-slate-400';
    document.getElementById('btnDetail').className = mode === 'detail' ? 'tab-btn active px-3 py-1 rounded' : 'tab-btn px-3 py-1 rounded text-slate-400';
    
    document.getElementById('boxBasic').classList.toggle('hidden', mode !== 'basic');
    document.getElementById('boxDetail').classList.toggle('hidden', mode !== 'detail');
    calculateAll();
}

function toggleClaim() {
    document.getElementById('boxClaimInput').classList.toggle('hidden', !document.getElementById('chkClaim').checked);
    calculateAll();
}

function calculateAll() {
    let totalAsset = 0;
    let cash = 0;

    if (currentMode === 'basic') {
        totalAsset = parseFloat(document.getElementById('baseTotal').value) || 0;
        const illiquidPct = parseFloat(document.getElementById('rngIlliquid').value) || 0;
        cash = totalAsset * ((100 - illiquidPct) / 100);
    } else {
        const re = parseFloat(document.getElementById('dRealEstate').value) || 0;
        const ps = parseFloat(document.getElementById('dPublicStock').value) || 0;
        const privs = parseFloat(document.getElementById('dPrivateStock').value) || 0;
        const c = parseFloat(document.getElementById('dCash').value) || 0;
        totalAsset = re + ps + privs + c;
        cash = c;
    }

    // 免稅額與扣除額
    const deductions = 1333 + 138 +
        (document.getElementById('chkSpouse').checked ? 553 : 0) +
        ((parseInt(document.getElementById('numChild').value) || 0) * 56) +
        ((parseInt(document.getElementById('numParents').value) || 0) * 138) +
        ((parseInt(document.getElementById('numDisability').value) || 0) * 693) +
        (document.getElementById('chkClaim').checked ? (parseFloat(document.getElementById('claimAmount').value) || 0) : 0);

    const netEstate = Math.max(0, totalAsset - deductions);

    // 三級稅率
    let tax = 0;
    let rateStr = "免稅";
    if (netEstate > 0 && netEstate <= 5000) {
        tax = netEstate * 0.10;
        rateStr = "10%";
    } else if (netEstate > 5000 && netEstate <= 10000) {
        tax = netEstate * 0.15 - 250;
        rateStr = "15%";
    } else if (netEstate > 10000) {
        tax = netEstate * 0.20 - 750;
        rateStr = "20%";
    }

    tax = Math.round(tax);
    cash = Math.round(cash);
    const gap = tax > cash ? tax - cash : 0;

    // 介面更新
    document.getElementById('valTax').textContent = tax.toLocaleString() + " 萬";
    document.getElementById('valRate').textContent = "稅率: " + rateStr;
    document.getElementById('valCash').textContent = cash.toLocaleString() + " 萬";

    const boxGap = document.getElementById('boxGap');
    const badgeGap = document.getElementById('badgeGap');
    const valGap = document.getElementById('valGap');

    if (gap > 0) {
        boxGap.className = "p-2.5 rounded border bg-rose-950/40 border-rose-800 text-rose-200 text-xs";
        badgeGap.className = "px-1.5 py-0.2 rounded text-[10px] font-bold bg-rose-900 text-rose-100";
        badgeGap.textContent = "缺口過大";
        valGap.className = "text-xl font-black text-rose-400 mt-0.5";
        valGap.textContent = "- " + gap.toLocaleString() + " 萬元";
    } else {
        boxGap.className = "p-2.5 rounded border bg-emerald-950/40 border-emerald-800 text-emerald-200 text-xs";
        badgeGap.className = "px-1.5 py-0.2 rounded text-[10px] font-bold bg-emerald-900 text-emerald-100";
        badgeGap.textContent = "安全";
        valGap.className = "text-xl font-black text-emerald-400 mt-0.5";
        valGap.textContent = "流動性充足";
    }

    renderChart(totalAsset - cash, cash, tax, gap);
}

function renderChart(illiquid, cash, tax, gap) {
    const ctx = document.getElementById('balanceChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();

    const chartData = gap > 0 
        ? [illiquid, cash, gap]
        : [illiquid, Math.max(0, cash - tax), tax];

    const labels = gap > 0 
        ? ['不流動資產', '自有現金', '稅源缺口']
        : ['不流動資產', '稅後剩餘現金', '應納稅額'];

    const colors = gap > 0 
        ? ['#475569', '#3b82f6', '#f43f5e']
        : ['#475569', '#10b981', '#f59e0b'];

    chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: labels,
            datasets: [{
                data: chartData,
                backgroundColor: colors,
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false, // 關閉動畫，徹底防止連續 resize 事件觸發無限生長
            plugins: {
                legend: { 
                    position: 'right', 
                    labels: { boxWidth: 8, color: '#94a3b8', font: { size: 9 }, padding: 6 } 
                },
                tooltip: {
                    callbacks: {
                        label: (c) => ` ${c.label}: 約 ${c.raw.toLocaleString()} 萬`
                    }
                }
            }
        }
    });
}

// 監聽所有輸入
document.querySelectorAll('input').forEach(input => {
    input.addEventListener('input', calculateAll);
});

window.onload = () => calculateAll();
</script>

</body>
</html>
